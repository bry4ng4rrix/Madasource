# Environnement local de développement : PostgreSQL et backend.
# Variables : .env à la racine (copie de .env.example, jamais versionnée).
# Arrêt : `docker compose down` ; ne jamais ajouter -v (supprimerait les données).
name: madasource

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant, voir .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.example}
    ports:
      # Lié à 127.0.0.1 seulement : la base n'est pas exposée au réseau.
      - "127.0.0.1:${MADASOURCE_DB_HOST_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 : PGDATA=/var/lib/postgresql/18/docker, volume déclaré sur /var/lib/postgresql.
      - madasource_pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 : passe par TCP. Pendant l'initialisation, le serveur temporaire n'écoute
      # que sur le socket Unix ; sans -h, la base paraîtrait prête trop tôt.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      # Le mot de passe doit être compatible avec une URL (voir .env.example).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MADASOURCE_API_HOST_PORT:-8001}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  madasource_pgdata:
    # Nom explicite : sans lui, Compose préfixerait le nom du projet (madasource_madasource_pgdata).
    name: madasource_pgdata
