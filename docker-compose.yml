# Environnement local de développement : PostgreSQL et backend ; base de test éphémère
# (profil « test »).
# Variables : .env à la racine (copie de .env.example, jamais versionnée).
# Arrêt : `docker compose down` ; ne jamais ajouter -v (supprimerait les données).
name: madasource

services:
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant, voir .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.example}
      # Mot de passe du rôle applicatif madasource_app (script d'initialisation ci-dessous).
      MADASOURCE_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD manquant, voir .env.example}
    ports:
      # Lié à 127.0.0.1 seulement : la base n'est pas exposée au réseau.
      - "127.0.0.1:${MADASOURCE_DB_HOST_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 : PGDATA=/var/lib/postgresql/18/docker, volume déclaré sur /var/lib/postgresql.
      - madasource_pgdata:/var/lib/postgresql
      # Création du rôle applicatif à l'initialisation d'une base vide (idempotent). Le dossier
      # est monté, et non le fichier : un fichier monté seul reste figé à sa version d'origine.
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : passe par TCP. Pendant l'initialisation, le serveur temporaire n'écoute
      # que sur le socket Unix ; sans -h, la base paraîtrait prête trop tôt.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      # Obligatoire : sans APP_ENV, l'application refuse de démarrer (Q-102).
      APP_ENV: ${APP_ENV:?APP_ENV manquant, voir .env.example}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Rôle applicatif, sans droit sur le schéma (app/db/roles.py). Le mot de passe doit
      # être compatible avec une URL (voir .env.example). Les migrations ne tournent pas ici.
      DATABASE_URL: postgresql+asyncpg://madasource_app:${POSTGRES_APP_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?AUTH_SIGNING_KEY manquant, voir .env.example}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MADASOURCE_API_HOST_PORT:-8001}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Base de test éphémère (testing-strategy.md §4) : données en mémoire (tmpfs), vides à
  # chaque démarrage ; jamais la base de développement. Démarrage :
  # `docker compose --profile test up -d db-test`.
  db-test:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    profiles: ["test"]
    environment:
      POSTGRES_DB: madasource_test
      POSTGRES_USER: madasource_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD manquant, voir .env.example}
      MADASOURCE_APP_PASSWORD: ${POSTGRES_TEST_APP_PASSWORD:?POSTGRES_TEST_APP_PASSWORD manquant, voir .env.example}
    ports:
      - "127.0.0.1:${MADASOURCE_TEST_DB_HOST_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U madasource_test -d madasource_test"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  madasource_pgdata:
    # Nom explicite : sans lui, Compose préfixerait le nom du projet (madasource_madasource_pgdata).
    name: madasource_pgdata
