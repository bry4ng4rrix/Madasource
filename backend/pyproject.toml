[project]
name = "madasource-backend"
version = "0.1.0"
description = "API REST du backend MadaSource (FastAPI)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Versions épinglées exactement ; les dépendances transitives sont figées par uv.lock.
# Justification de chaque dépendance : backend/README.md, section « Dépendances ».
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "import-linter==2.15",
    "grimp==3.17",
    "pytest-cov==7.1.0",
]

[tool.uv]
# Application, pas bibliothèque : uv installe les dépendances sans empaqueter le projet.
package = false
# Même version d'uv en local, en CI et dans l'image Docker.
required-version = "==0.13.0"
# Dépendances transitives retenues sous leur dernière version, publiée depuis moins de
# 14 jours (délai de carence, Q-104 b) : pycparser 3.1 et 3.11 (2026-10-08, 2026-10-09).
constraint-dependencies = ["pycparser==3.0"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # tri des imports
    "B",        # bugbear
    "UP",       # syntaxe moderne
    "S",        # sécurité (bandit)
    "ASYNC",    # erreurs courantes en asyncio
    "DTZ",      # datetime naïfs interdits
    "SIM",      # simplifications
    "PT",       # style pytest
    "T20",      # pas de print
    "RUF",      # règles propres à Ruff
    "INP",      # paquet sans __init__.py : il échapperait à import-linter et au test d'architecture
]

[tool.ruff.lint.isort]
# `app` est le paquet du projet ; le dossier alembic/ n'est pas le paquet `alembic`.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# S101 : `assert` est le mécanisme d'assertion de pytest ; il reste interdit dans app/.
# INP001 : tests/ (pytest en mode importlib) et alembic/ (scripts chargés par Alembic) ne
# sont pas des paquets, volontairement ; la règle vaut pour app/.
"tests/**" = ["S101", "INP001"]
"alembic/**" = ["INP001"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests", "alembic/env.py", "alembic/versions"]
# Modules nommés depuis backend/ (tests.support, et non support), sans __init__.py.
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
# asyncpg ne publie pas d'annotations de types (ni py.typed, ni stubs officiels) ; il n'est
# importé que par les tests, qui simulent ses erreurs de connexion.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.importlinter]
# Frontières de l'architecture (module-boundaries.md §3 et §9), contrôlées par `lint-imports`.
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
id = "socle"
name = "Couches de l'application : API, modules métier, puis socle core → db → common → integrations"
type = "layers"
# Du plus haut au plus bas : une couche n'importe que des couches inférieures.
# Les noms entre parenthèses sont facultatifs : contrôlés dès qu'ils existent.
layers = [
    "app.main",
    # Racine de composition (module-boundaries.md §5.2), indépendante de la couche HTTP.
    "(app.wiring) | app.api",
    "app.modules",
    "(app.integrations)",
    "(app.common)",
    "app.db",
    "app.core",
]

[[tool.importlinter.contracts]]
id = "modules"
name = "Modules métier par niveau : dépendances vers les niveaux inférieurs seulement"
type = "layers"
containers = ["app.modules"]
# Niveaux de module-boundaries.md §3, du plus haut (20) au plus bas (1). « | » : modules d'un
# même niveau, indépendants l'un de l'autre. Tous facultatifs : créés au jour de leur
# implémentation. exhaustive : un module absent de cette liste fait échouer le contrôle.
exhaustive = true
layers = [
    "(admin)",
    "(marketplace)",
    "(matching)",
    "(reviews)",
    "(exceptions)",
    "(payment_records) | (shipments) | (samples)",
    "(trades)",
    "(negotiations)",
    "(quotations)",
    "(rfqs)",
    "(products)",
    "(exporters)",
    "(buyers) | (verification)",
    "(messages)",
    "(documents)",
    "(notifications)",
    "(access_control)",
    "(organizations)",
    "(auth)",
    "(audit)",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
# importlib : deux fichiers de test de même nom dans des dossiers différents ne se gênent pas.
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: logique pure, sans base ni HTTP",
    "api: endpoints, par le client HTTP en mémoire",
    "integration: exige la base de test (docker compose --profile test up -d db-test)",
]

[tool.coverage.run]
source = ["app", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Seuil minimal : sous ce taux, la suite échoue (99,42 % mesurés le 2026-10-16 ; seuil : Q-104).
fail_under = 95
